      if (roomName.startsWith("C")) {
        if (rx > 780) {
          exitName = "Boys Wing Fire Exit"; distance = "~26 meters";
          path = [[doorX, doorY], [doorX, 144], [968, 144], [968, 95], [950, 95], [950, 144], [950, 185]];
          segments = [
            { pts: [[doorX, doorY], [doorX, 144], [968, 144], [968, 95], [950, 95]], is2F: true, hasArrow: false },
            { pts: [[950, 95], [950, 144], [950, 185]], is2F: false, hasArrow: true }
          ];
          let step1 = `Turn ${isTopRow ? "left" : "right"} from your room and take the East hallway staircase to the ground floor.`;
          if (roomName === "C11") {
            step1 = `Exit your room and take the East hallway staircase to the ground floor.`;
          } else if (roomName === "C12") {
            step1 = `Exit your room and take the adjacent East hallway staircase to the ground floor.`;
          }
          steps = [
            step1,
            `Push open the door across the stairs at the ground floor and you will see the Fire Exit door.`,
            `Exit the building safely and proceed to a safe clearing/emergency holding area.`
          ];
        } else {
          exitName = "Main Entrance Exit"; distance = "~28 meters";
          path = [[doorX, doorY], [doorX, 144], [536, 144], [546, 344], [536, 245], [556, 245]];
          segments = [
            { pts: [[doorX, doorY], [doorX, 144], [536, 144], [546, 344]], is2F: true, hasArrow: false },
            { pts: [[546, 344], [536, 245], [556, 245]], is2F: false, hasArrow: true }
          ];
          if (roomName === "C20") {
            steps = [
              `Exit your room and proceed down the central circular stairs to the ground floor lobby.`,
              `Exit through the main entrance door to the safe clearing/emergency holding area.`
            ];
          } else {
            const turnDir = isTopRow ? "right" : "left";
            steps = [
              `Turn ${turnDir} from your room going to the central circular stairs.`,
              `Proceed down the central stairs to the ground floor lobby.`,
              `Exit through the main entrance door to the safe clearing/emergency holding area.`
            ];
          }
        }
      } else {
        if (rx < 300) {
          exitName = "Girls Wing Fire Exit"; distance = "~24 meters";
          path = [[doorX, doorY], [doorX, 361], [120, 361], [120, 315], [101, 315], [101, 361], [101, 395]];
          segments = [
            { pts: [[doorX, doorY], [doorX, 361], [120, 361], [120, 315], [101, 315]], is2F: true, hasArrow: false },
            { pts: [[101, 315], [101, 361], [101, 395]], is2F: false, hasArrow: true }
          ];
          let step1 = `Turn ${isTopRow ? "right" : "left"} from your room and take the West hallway staircase to the ground floor.`;
          if (roomName === "B1") {
            step1 = `Exit your room and take the West hallway staircase to the ground floor.`;
          } else if (roomName === "B20") {
            step1 = `Exit your room and take the adjacent West hallway staircase to the ground floor.`;
          }
          steps = [
            step1,
            `Push open the door across the stairs at the ground floor and you will see the Fire Exit door.`,
            `Exit the building safely and proceed to a safe clearing/emergency holding area.`
          ];
        } else {
          exitName = "Main Entrance Exit"; distance = "~26 meters";
          path = [[doorX, doorY], [doorX, 361], [536, 361], [546, 344], [536, 245], [556, 245]];
          segments = [
            { pts: [[doorX, doorY], [doorX, 361], [536, 361], [546, 344]], is2F: true, hasArrow: false },
            { pts: [[546, 344], [536, 245], [556, 245]], is2F: false, hasArrow: true }
          ];
          if (roomName === "B12") {
            steps = [
              `Exit your room and proceed down the central circular stairs to the ground floor lobby.`,
              `Exit through the main entrance door to the safe clearing/emergency holding area.`
            ];
          } else {
            const turnDir = isTopRow ? "left" : "right";
            steps = [
              `Turn ${turnDir} from your room going to the central circular stairs.`,
              `Proceed down the central stairs to the ground floor lobby.`,
              `Exit through the main entrance door to the safe clearing/emergency holding area.`
            ];
          }
        }
      }
    }

    // Calculate exact path length in meters dynamically (1 SVG unit = 0.09 meters)
    let totalLength = 0;
    if (segments && segments.length > 0) {
      segments.forEach(seg => {
        for (let i = 0; i < seg.pts.length - 1; i++) {
          const dx = seg.pts[i+1][0] - seg.pts[i][0];
          const dy = seg.pts[i+1][1] - seg.pts[i][1];
          totalLength += Math.hypot(dx, dy);
        }
      });
    }
    let meters = Math.round(totalLength * 0.09);
    if (meters < 3) meters = 3;
    distance = `~${meters} meters`;

    return { path, segments, exitName, distance, steps, rx, ry, doorX, doorY, floor, isTopRow };
  }

      txt1.setAttribute("fill", "#111111");
      txt1.textContent = "YOU ARE";
      pinG.appendChild(txt1);

      const txt2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
      txt2.setAttribute("x", doorX.toString());

      txt2.setAttribute("font-size", "5.8px");

      txt2.setAttribute("fill", "#111111");
      txt2.textContent = "HERE";
      pinG.appendChild(txt2);

      pinsGroup.appendChild(pinG);
    }

    // Place Fire Exit Signs OUTSIDE doorways so they do NOT cover terminal path arrowheads
    if (floor === "GF") {
      if (roomName.startsWith("D") || roomName === "DM Office") {
        renderFireExitSign(pinsGroup, 960, 210);

      } else if (roomName.startsWith("A")) {

    } else {

          renderFireExitSign(pinsGroup, 556, 280);
        }

    ["GF", "2F"].forEach(floor => {
      MODEL[floor].forEach(zone => {
        if (zone.name && (/^(A|B|C|D)\d+$/.test(zone.name) || zone.name === "DM Office")) {
          if (zone.cat !== "empty") {
            roomList.push({ floor, roomName: zone.name });
          }
        }
      });
    });

    roomList.forEach((item, idx) => {
      batchHTML += generateSingleCardHTML(item.floor, item.roomName, idx);
    });

    container.innerHTML = batchHTML;

    // Render SVGs for each generated card
    roomList.forEach((item) => {
      renderSVGForCard(item.floor, item.roomName);
    });

    document.getElementById("batchCountTag").innerText = `Generated ${roomList.length} Non-Vacant Resident Room Signage Cards`;
  }

  generateFullBatch();
</script>
</body>
</html>
